name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: `-D warnings` on a floating stable turns a clippy release
      # into a build break with no change here. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Demo bundle scan
        run: |
          cargo run --example make_bundle -- demo
          cargo run -- scan demo/chatapp-1.0
          cargo run -- diff demo/chatapp-1.0 demo/chatapp-1.1 || test $? -eq 1

  # Tests also run against current stable, so real breakage still surfaces
  # even though the lint job is pinned.
  test-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
